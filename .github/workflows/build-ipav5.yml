name: Build Kimchi IPA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          set -e
          HTML=""; BEST=-1
          for f in *.html; do
            n="$(grep -o 'kimchi-build: [0-9]*' "$f" | head -1 | grep -o '[0-9]*' || true)"
            n="${n:-0}"
            if [ "$n" -gt "$BEST" ]; then BEST="$n"; HTML="$f"; fi
          done
          PNG="$(ls *.png | head -1)"
          echo "Using $HTML and $PNG"
          mkdir -p Sources Resources/Assets.xcassets/AppIcon.appiconset
          cp "$HTML" Resources/index.html
          cp "$PNG" Resources/Assets.xcassets/AppIcon.appiconset/icon.png
          cat > Resources/Assets.xcassets/Contents.json <<'EOF'
          {"info":{"author":"xcode","version":1}}
          EOF
          cat > Resources/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          EOF
          cat > Sources/App.swift <<'EOF'
          import SwiftUI
          import WebKit

          @main
          struct KimchiApp: App {
              var body: some Scene {
                  WindowGroup {
                      ZStack {
                          Color(red: 0.063, green: 0.075, blue: 0.106)
                          KimchiWebView()
                      }
                      .ignoresSafeArea()
                      .preferredColorScheme(.dark)
                  }
              }
          }

          // Mirrors the page's saved settings, chats and memory into UserDefaults so they survive relaunches.
          final class StoreBridge: NSObject, WKScriptMessageHandler {
              static let prefix = "kimchi.store."
              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  guard let d = message.body as? [String: Any], let k = d["k"] as? String else { return }
                  let key = StoreBridge.prefix + k
                  if let v = d["v"] as? String { UserDefaults.standard.set(v, forKey: key) }
                  else { UserDefaults.standard.removeObject(forKey: key) }
              }
          }

          struct KimchiWebView: UIViewRepresentable {
              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []
                  var saved: [String: String] = [:]
                  for (key, value) in UserDefaults.standard.dictionaryRepresentation() where key.hasPrefix(StoreBridge.prefix) {
                      if let s = value as? String { saved[String(key.dropFirst(StoreBridge.prefix.count))] = s }
                  }
                  if let data = try? JSONSerialization.data(withJSONObject: saved),
                     let json = String(data: data, encoding: .utf8) {
                      config.userContentController.addUserScript(WKUserScript(
                          source: "window.__KIMCHI_NATIVE__ = \(json);",
                          injectionTime: .atDocumentStart, forMainFrameOnly: true))
                  }
                  config.userContentController.add(StoreBridge(), name: "kimchi")
                  let web = WKWebView(frame: .zero, configuration: config)
                  let bg = UIColor(red: 0.063, green: 0.075, blue: 0.106, alpha: 1)
                  web.backgroundColor = bg
                  web.scrollView.backgroundColor = bg
                  web.scrollView.contentInsetAdjustmentBehavior = .never
                  web.scrollView.bounces = true
                  web.scrollView.alwaysBounceVertical = true
                  web.scrollView.alwaysBounceHorizontal = true
                  if #available(iOS 16.4, *) { web.isInspectable = true }
                  if let url = Bundle.main.url(forResource: "index", withExtension: "html"),
                     let html = try? String(contentsOf: url, encoding: .utf8) {
                      web.loadHTMLString(html, baseURL: URL(string: "https://kimchi.local/"))
                  }
                  return web
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }
          EOF
          cat > project.yml <<'EOF'
          name: Kimchi
          options:
            bundleIdPrefix: com.kimchi
            deploymentTarget:
              iOS: "16.0"
          targets:
            Kimchi:
              type: application
              platform: iOS
              sources: [Sources, Resources]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.kimchi.localai
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  SWIFT_VERSION: "5.0"
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: Kimchi
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          EOF
      - name: Build unsigned app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Kimchi.xcodeproj -scheme Kimchi -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Kimchi.app Payload/
          zip -qr Kimchi.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Kimchi-ipa
          path: Kimchi.ipa
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kimchi build ${{ github.run_number }}
          files: Kimchi.ipa
